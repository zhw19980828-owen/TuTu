<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电商商拍复刻设置</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="page">
      <section class="workspace">
        <aside class="sidebar">
          <nav class="sidebar-nav" aria-label="我的页面分栏">
            <button class="sidebar-link" type="button" data-tab-target="settings">设置</button>
            <button class="sidebar-link is-active" type="button" data-tab-target="history">生成记录</button>
          </nav>
        </aside>

        <section class="content-card">
          <section class="tab-panel" data-tab-panel="settings">
            <form id="settings-form">
              <label>
                <span>后端地址</span>
                <input name="backendBaseUrl" type="url" placeholder="http://127.0.0.1:8787" required />
              </label>
              <label>
                <span>访问口令（留空也可用）</span>
                <input name="proxyToken" type="password" placeholder="自己本机用时通常可以留空" />
              </label>
              <label>
                <span>模型名</span>
                <input name="model" type="text" placeholder="openai/gpt-5.4-image-2" required />
              </label>
              <label>
                <span>识图模型</span>
                <input name="visionModel" type="text" placeholder="moonshotai/kimi-k2.6" required />
              </label>
              <label>
                <span>非服饰 SP</span>
                <textarea name="nonApparelPrompt" rows="8" placeholder="控制非服饰链路：参考图负责场景模板，商品图负责主体替换。"></textarea>
              </label>
              <label>
                <span>服饰最终图 SP</span>
                <textarea name="apparelFinalPrompt" rows="8" placeholder="控制服饰链路：参考图负责人物/姿势/场景，商品图只负责服饰外观。"></textarea>
              </label>
              <label>
                <span>默认附加 Prompt</span>
                <textarea name="defaultUserPrompt" rows="4" placeholder="例如：适合电商首页投放、商品主体清晰、背景高级、面料质感明确"></textarea>
              </label>
              <label>
                <span>图片尺寸</span>
                <input name="imageSize" type="text" placeholder="2K" />
              </label>
              <label>
                <span>返回图片路径</span>
                <input name="responseDataPath" type="text" placeholder="OpenRouter 图片输出自动解析，这里通常留空" />
              </label>
              <label>
                <span>额外请求体 JSON</span>
                <textarea name="extraBody" rows="6" placeholder='{}'></textarea>
              </label>
              <div class="actions">
                <button type="submit" id="save-button">保存设置</button>
                <a href="https://www.xiaohongshu.com" target="_blank" rel="noreferrer">打开站点测试</a>
              </div>
              <p class="status" id="status"></p>
            </form>
          </section>

          <section class="tab-panel is-active" data-tab-panel="history">
            <div class="history-grid" id="history-grid"></div>
            <div class="history-empty" id="history-empty" hidden>还没有生成记录，先去生成一张试试。</div>
          </section>
        </section>
      </section>
    </main>
    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭预览">关闭</button>
      <img class="lightbox-image" id="lightbox-image" alt="生成结果大图预览" />
      <div class="lightbox-detail" id="lightbox-detail"></div>
    </div>
    <script src="./options.js"></script>
  </body>
</html>
